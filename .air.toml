#:schema https://json.schemastore.org/any.json

root = "."
tmp_dir = "tmp"

[build]
  delay = 500

  cmd = "go build -tags sqlite_fts5 -o ./tmp/main ./cmd/agent/main.go"
  bin = "./tmp/main"

  exclude_dir = ["tmp", "vendor", "testdata"]

  include_ext = ["go"]
  exclude_regex = ["_test.go"]

  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = true

[log]
  time = true
  main_only = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
